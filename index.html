<style>
:root{--bg:#f4f7ff;--card:#fff;--tx:#1b1f3b;--mut:#5a6086;--b:#2f5bff;--p:#7c3aed;--c:#06b6d4;--o:#ff7a1a;--r:#ef233c;--y:#ffc800;--g:#12a150;--bd:#dfe5ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1230;--card:#1b2050;--tx:#eef0ff;--mut:#aab0e0;--bd:#323a85}}
:root[data-theme="dark"]{--bg:#0f1230;--card:#1b2050;--tx:#eef0ff;--mut:#aab0e0;--bd:#323a85}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
.noanim *{transition:none!important;animation:none!important}
header{background:linear-gradient(110deg,var(--b),var(--p),var(--c));color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:1.25rem}header small{opacity:.95}
.tools button{background:#ffffff33;color:#fff;border:1px solid #fff8;border-radius:10px;padding:8px 10px;cursor:pointer;min-height:40px;margin-left:4px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:var(--card);border-bottom:2px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{white-space:nowrap;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:12px;padding:9px 13px;cursor:pointer;font-weight:600;min-height:42px}
nav button.on{background:var(--b);color:#fff;border-color:var(--b)}
main{flex:1;padding:16px;max-width:1100px;width:100%;margin:0 auto}
.card{background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 4px 14px #2f5bff14}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stat{border-radius:16px;padding:14px;color:#fff;font-weight:700}.stat b{display:block;font-size:1.7rem}
.s1{background:linear-gradient(135deg,var(--b),var(--p))}.s2{background:linear-gradient(135deg,var(--o),var(--r))}.s3{background:linear-gradient(135deg,#0a7a3d,#0ea5a5)}.s4{background:linear-gradient(135deg,#a16207,#d97706)}
.btn{background:var(--b);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:42px;margin:3px}
.btn.o{background:var(--o)}.btn.g{background:var(--g)}.btn.p{background:var(--p)}.btn.r{background:var(--r)}.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--y);outline-offset:2px}
h2{margin:.2em 0 .5em;color:var(--p)}h3{color:var(--b);margin:.4em 0}
.bar{height:16px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--g));transition:width .5s}
canvas{width:100%;max-width:100%;border-radius:14px;background:#0d1b4c;display:block}
canvas.light{background:#fff;border:2px solid var(--bd)}
label{display:block;font-weight:600;margin:8px 0 2px}input[type=range]{width:100%;height:30px}
input[type=number],select{padding:8px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);width:100%;min-height:40px}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.f{font-family:Georgia,serif;background:#7c3aed18;border-left:5px solid var(--p);padding:8px 12px;border-radius:8px;margin:8px 0;overflow-x:auto}
.tag{display:inline-block;border-radius:20px;padding:3px 10px;font-weight:700;font-size:.85rem;color:#fff;margin:2px}
.ok{color:var(--g);font-weight:700}.bad{color:var(--r);font-weight:700}
details{border:2px solid var(--bd);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--bg)}summary{cursor:pointer;font-weight:700;color:var(--b)}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;font-size:1rem;min-height:44px}
.opt.sel{border-color:var(--p);background:#7c3aed22}.opt.right{border-color:var(--g);background:#12a15022}.opt.wrong{border-color:var(--r);background:#ef233c22}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:6px;text-align:center}th{background:#2f5bff22}
.bdg{display:inline-block;padding:10px 12px;margin:4px;border-radius:14px;border:2px dashed var(--bd);opacity:.45}.bdg.on{opacity:1;border:2px solid var(--y);background:#ffc80026}
footer{background:linear-gradient(110deg,var(--p),var(--b));color:#fff;text-align:center;padding:16px;font-weight:700}
.note{font-size:.88rem;color:var(--mut)}.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px}.fr i{font-style:normal;padding:0 5px}.fr i:first-child{border-bottom:1.5px solid currentColor}details canvas{max-width:760px}@media print{header,nav,footer,.noprint,button{display:none!important}}
</style></head><body>
<header><div><h1>⚡ REACTION RATE EXPLORER 3D</h1><small>Control the Particles, Discover the Reaction Speed!</small></div>
<div class="tools"><button id="tTheme" aria-label="Mode terang/gelap">🌓 Tema</button><button id="tAnim" aria-label="Kurangi animasi">🎞️ Animasi: ON</button><button id="tSnd" aria-label="Efek suara">🔊 Suara: ON</button></div></header>

<script>
const $=s=>document.querySelector(s);
const PAGES=[['home','🚀 Dashboard'],['materi','📚 Materi'],['lab','⚛️ Lab Tumbukan'],['graf','📊 Grafik'],['calc','🧮 Kalkulator'],['quiz','🎯 Tantangan'],['prof','🏆 Pencapaian']];
const LV=[['Particle Beginner',0],['Collision Explorer',60],['Reaction Speed Hunter',150],['Rate Law Specialist',260],['Kinetics Analyst',400],['Arrhenius Expert',560],['Reaction Mechanism Master',760],['Reaction Rate Legend',1000]];
const BG=[['col','⚛️ Collision Expert','Selesaikan materi Teori Tumbukan'],['spd','⚡ Reaction Speed Master','Selesaikan materi Faktor-Faktor'],['tmp','🌡️ Temperature Controller','Selesaikan materi Laju di Kehidupan'],['gra','📊 Graph Analyst','Gunakan Grafik Studio'],['law','🧮 Rate Law Calculator','Gunakan analisis orde'],['q1','🎯 Level 1 Lulus','Lulus tantangan Level 1'],['leg','🏆 Reaction Rate Legend','Lulus semua level']];
let S={xp:0,done:{},best:{},bdg:{},exp:0,set:{anim:1,snd:1,theme:''}};
try{const j=localStorage.getItem('rre3');if(j)S=Object.assign(S,JSON.parse(j))}catch(e){}
const save=()=>{try{localStorage.setItem('rre3',JSON.stringify(S))}catch(e){}};
function beep(f){if(!S.set.snd)return;try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f||660;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch(e){}}
function award(id,xp,b){const mb={m1:'col',m2:'spd',m4:'tmp'};if(mb[id])b=mb[id];let n=0;if(!S.done[id]){S.done[id]=1;S.xp+=xp;n=xp;if(id.startsWith('lab'))S.exp++;beep(880)}if(b&&!S.bdg[b]){S.bdg[b]=1;beep(990)}save();if(n)toast('+'+n+' XP ✨')}
function toast(t){const d=document.createElement('div');d.textContent=t;d.setAttribute('role','status');d.style.cssText='position:fixed;right:14px;bottom:70px;background:#12a150;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;z-index:9';document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
const lvl=()=>{let i=0;LV.forEach((l,k)=>{if(S.xp>=l[1])i=k});return i};
function applySet(){const r=document.documentElement;S.set.theme?r.setAttribute('data-theme',S.set.theme):r.removeAttribute('data-theme');document.body.classList.toggle('noanim',!S.set.anim);$('#tAnim').textContent='🎞️ Animasi: '+(S.set.anim?'ON':'OFF');$('#tSnd').textContent='🔊 Suara: '+(S.set.snd?'ON':'OFF')}
$('#tTheme').onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!S.set.theme&&matchMedia('(prefers-color-scheme:dark)').matches);S.set.theme=dark?'light':'dark';save();applySet()};
$('#tAnim').onclick=()=>{S.set.anim=S.set.anim?0:1;save();applySet()};
$('#tSnd').onclick=()=>{S.set.snd=S.set.snd?0:1;save();applySet()};
let cur='home',raf=0;
function go(p){cancelAnimationFrame(raf);cur=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));$('#m').innerHTML='';R[p]();scrollTo(0,0)}
PAGES.splice(5,0,['kc','📖 Pengetahuan']);PAGES.splice(3,0,['exp','🔬 Eksperimen']);PAGES.push(['champ','🎓 Champion']);PAGES.splice(5,0,['gid','🧐 Tebak Grafik']);$('#nav').innerHTML=PAGES.filter(p=>p[0]!='lab').map(p=>`<button data-p="${p[0]}">${p[1]}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.p)go(e.target.dataset.p)};
const M=h=>$('#m').innerHTML=h;
const pct=()=>Math.round(Object.keys(S.done).length/16*100);
const R={};
R.home=()=>{const l=lvl(),nx=LV[l+1],pr=nx?(S.xp-LV[l][1])/(nx[1]-LV[l][1])*100:100;
M(`<div class="card"><h2>WELCOME TO REACTION RATE EXPLORER 3D</h2><p>Setiap reaksi memiliki kecepatan. Temukan bagaimana partikel bertumbukan, energi aktivasi bekerja, dan faktor tertentu mengubah laju reaksi!</p>
<div class="grid"><div class="stat s1">Level<b>${LV[l][0]}</b></div><div class="stat s2">Total XP<b>${S.xp}</b></div><div class="stat s3">Topik materi selesai<b>${Object.keys(S.done).filter(k=>/^m[0-5]$/.test(k)).length}/6</b></div><div class="stat s4">Materi selesai<b>${pct()}%</b></div></div>
<p>Menuju level berikutnya: ${nx?nx[1]-S.xp+' XP lagi':'Level maksimal!'}</p><div class="bar" role="progressbar" aria-valuenow="${Math.round(pr)}"><i style="width:${pr}%"></i></div>
<p><button class="btn" onclick="go('materi')">🚀 Mulai Petualangan</button><button class="btn o" onclick="go('materi')">⚛️ Teori Tumbukan</button><button class="btn p" onclick="go('graf')">📊 Grafik Studio</button><button class="btn g" onclick="go('calc')">🧮 Kalkulator</button><button class="btn r" onclick="go('quiz')">🎯 Tantangan</button></p>
<p class="note">💡 Rekomendasi: ${!S.done.m0?'Baca materi Konsep Dasar.':!S.done.m1?'Pelajari Teori Tumbukan dan amati animasinya.':!S.done.gr?'Jelajahi Grafik Studio.':!S.best[1]?'Kerjakan Tantangan Level 1.':'Lanjutkan level tantangan berikutnya!'} Progres disimpan di perangkat ini (localStorage), tidak disinkronkan antar-perangkat.</p></div>`)};
const MAT=[['Konsep Dasar Laju Reaksi','Laju reaksi = perubahan konsentrasi reaktan/produk per satuan waktu.',['v = −(1/a)·Δ[A]/Δt  (reaktan)','v = +(1/c)·Δ[C]/Δt  (produk)'],'Tanda minus: reaktan berkurang. Koefisien menyamakan laju tiap zat. Laju rata-rata = kemiringan garis antara dua titik; laju sesaat = kemiringan garis singgung. Contoh: [A] turun 0,8→0,4 M dalam 20 s → v = 0,4/20 = 0,02 M/s.'],
['Teori Tumbukan & Energi Aktivasi','Reaksi terjadi lewat tumbukan, tetapi hanya tumbukan efektif yang menghasilkan produk.',['Syarat efektif: (1) energi ≥ Ea, (2) orientasi tepat'],'Energi aktivasi (Ea) adalah energi minimum untuk mencapai keadaan transisi. Ea ≠ ΔH. Simulasi partikel adalah penyederhanaan proses molekuler nyata.'],
['Faktor-Faktor Laju Reaksi','Konsentrasi, luas permukaan, suhu, katalis, dan tekanan (gas).',['Suhu ↑ → fraksi partikel dengan E ≥ Ea ↑'],'Konsentrasi ↑ → tumbukan per waktu ↑. Serbuk lebih cepat daripada bongkahan (luas permukaan kontak besar). Suhu tidak hanya menambah frekuensi tumbukan, tetapi terutama fraksi tumbukan berenergi cukup. Katalis membuka jalur dengan Ea lebih rendah, ΔH tetap, tidak habis bereaksi. Tekanan gas ↑ (volume ↓) → konsentrasi gas ↑.'],
['Persamaan Laju & Orde','Orde ditentukan dari eksperimen, bukan dari koefisien reaksi.',['v = k[A]^m[B]^n','k = v / ([A]^m[B]^n)'],'Orde 0: v=k. Orde 1: v=k[A]. Orde 2: v=k[A]². Satuan k: orde total 0 → M s⁻¹; 1 → s⁻¹; 2 → M⁻¹ s⁻¹; 3 → M⁻² s⁻¹. Metode laju awal: bandingkan dua percobaan dengan satu konsentrasi tetap (lihat Kalkulator).'],
['Persamaan Terintegrasi & Waktu Paruh','Hubungan [A] dan t untuk reaksi satu reaktan.',['Orde 0: [A]=[A]₀−kt ; t½=[A]₀/2k','Orde 1: ln[A]=ln[A]₀−kt ; t½=0,693/k','Orde 2: 1/[A]=1/[A]₀+kt ; t½=1/(k[A]₀)'],'Rumus t½ berbeda tiap orde. Grafik linear: [A]–t (orde 0), ln[A]–t (orde 1), 1/[A]–t (orde 2).'],
['Persamaan Arrhenius','Kenaikan suhu menaikkan k.',['k = A·e^(−Ea/RT)','ln(k₂/k₁) = −(Ea/R)(1/T₂ − 1/T₁)'],'T wajib dalam Kelvin (K = °C + 273). R = 8,314 J mol⁻¹ K⁻¹. Grafik ln k vs 1/T linear dengan gradien −Ea/R.'],
['Laju Reaksi di Kehidupan','Kayu serpih terbakar lebih cepat dari balok; kulkas memperlambat pembusukan; katalis kendaraan mengubah gas buang berbahaya; tablet effervescent hancur larut lebih cepat; enzim = katalis biologis; korosi dipengaruhi lembap, O₂, elektrolit.',['Luas permukaan, suhu, katalis, konsentrasi'],'Nalar: mengapa tablet yang dihancurkan larut lebih cepat? Karena luas permukaan kontak dengan air lebih besar sehingga tumbukan per waktu lebih banyak.'],
['Kesalahan Umum','Hindari miskonsepsi ini:',['✗ Semua tumbukan menghasilkan reaksi','✗ Ea = ΔH','✗ Katalis mengubah ΔH','✗ Orde = koefisien reaksi','✗ Satuan k selalu sama','✗ Luas permukaan = massa'],'Koreksi: hanya tumbukan efektif yang bereaksi; Ea dan ΔH berbeda; katalis hanya menurunkan Ea; orde dari eksperimen; satuan k bergantung orde total.']];
const fr=(a,b)=>`<span class="fr"><i>${a}</i><i>${b}</i></span>`;
const tb=(h,r)=>`<div style="overflow-x:auto"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
let AN=[];const vis=c=>c.offsetParent!==null,rnd=a=>Math.random()*a,sm=s=>s*s*(3-2*s);
const mk=id=>{const c=document.getElementById(id);return[c,c.getContext('2d'),c.width,c.height]};
const mv=(P,v,W,H)=>P.forEach(p=>{p.x+=Math.cos(p.a)*v;p.y+=Math.sin(p.a)*v;if(p.x<6||p.x>W-6)p.a=Math.PI-p.a;if(p.y<6||p.y>H-6)p.a=-p.a;p.x=Math.max(6,Math.min(W-6,p.x));p.y=Math.max(6,Math.min(H-6,p.y))});
const bg=(x,W,H)=>{x.fillStyle='#0d1b4c';x.fillRect(0,0,W,H)};
const dot=(x,X,Y,r,c)=>{x.fillStyle=c;x.beginPath();x.arc(X,Y,r,0,6.28);x.fill()};
const db=(x,X,Y,a,c1,c2)=>{dot(x,X-Math.cos(a)*14,Y-Math.sin(a)*14,12,c1);dot(x,X+Math.cos(a)*14,Y+Math.sin(a)*14,12,c2)};
MAT[0]=['Konsep Dasar Laju Reaksi','Laju reaksi (r) adalah perubahan konsentrasi reaktan atau produk per satuan waktu.',[`Reaksi A → B:  r = −${fr('Δ[A]','Δt')} = +${fr('Δ[B]','Δt')}`,'Reaksi umum:  aA + bB → cC + dD',`r = −${fr(1,'a')}${fr('Δ[A]','Δt')} = −${fr(1,'b')}${fr('Δ[B]','Δt')} = +${fr(1,'c')}${fr('Δ[C]','Δt')} = +${fr(1,'d')}${fr('Δ[D]','Δt')}`],'Tanda minus (−) dipakai untuk reaktan karena konsentrasinya berkurang; tanda plus (+) untuk produk karena bertambah. Koefisien (a, b, c, d) menyamakan laju yang dinyatakan terhadap tiap zat. Satuan r: M/s (mol L⁻¹ s⁻¹). Laju rata-rata = kemiringan garis antara dua titik; laju sesaat = kemiringan garis singgung. Contoh: [A] turun dari 0,8 M menjadi 0,4 M dalam 20 s → r = 0,4/20 = 0,02 M/s.'];
MAT[1]=['Teori Tumbukan & Energi Aktivasi','Reaksi terjadi melalui tumbukan antarpartikel, tetapi tidak semua tumbukan menghasilkan reaksi.',['Tumbukan efektif: (1) energi ≥ Ea dan (2) orientasi tepat'],'Energi aktivasi (Ea) adalah energi minimum untuk mencapai keadaan transisi; Ea berbeda dari ΔH. Pilih jenis tumbukan lalu amati animasi: tumbukan efektif melewati puncak grafik energi dan menghasilkan produk, tumbukan tidak efektif memantul dan kembali ke reaktan. Model ini penyederhanaan 2D dari proses molekuler.',`<canvas id="cc" width="760" height="300" aria-label="Animasi tumbukan efektif dan tidak efektif"></canvas><p><button class="btn g" data-m="0">✔ Tumbukan efektif</button><button class="btn r" data-m="1">✘ Energi kurang</button><button class="btn o" data-m="2">✘ Orientasi salah</button></p><div class="row"><div>Konsentrasi reaktan<div class="bar"><i id="bR" style="width:100%"></i></div></div><div>Konsentrasi produk<div class="bar"><i id="bP" style="width:0"></i></div></div></div><p id="cx" class="note"></p>`,ini1];
const fc=(t,id,ctl,l)=>`<div class="card"><h3>${t}</h3><canvas id="${id}" width="340" height="200"></canvas>${ctl}<p id="${l}" class="note" style="margin:4px 0"></p></div>`;
MAT[2]=['Faktor-Faktor Laju Reaksi','Empat faktor utama: konsentrasi, luas permukaan, suhu, dan katalisator.',['Konsentrasi ↑ , luas permukaan ↑ , suhu ↑ , katalis → laju reaksi ↑'],'<b>1. Konsentrasi</b>: konsentrasi lebih besar berarti lebih banyak partikel per volume, sehingga tumbukan per detik bertambah dan laju naik (besar pengaruhnya bergantung orde reaksi).<br><b>2. Luas permukaan</b>: zat padat berbentuk serbuk memiliki permukaan kontak jauh lebih luas daripada bongkahan bermassa sama, sehingga tumbukan dengan pereaksi lain lebih banyak.<br><b>3. Suhu</b>: partikel bergerak lebih cepat dan, yang terpenting, fraksi partikel berenergi ≥ Ea meningkat sehingga tumbukan efektif bertambah.<br><b>4. Katalisator</b>: menyediakan jalur reaksi alternatif dengan Ea lebih rendah; ΔH tidak berubah dan katalis tidak habis bereaksi.',`<div class="row">`+fc('1. Konsentrasi','f1','<input type="range" id="s1" min="4" max="40" value="10" aria-label="Jumlah partikel">','l1')+fc('2. Luas permukaan','f2','<button class="btn" data-sa="1">🧱 Bongkahan</button><button class="btn o" data-sa="0">✨ Serbuk</button>','l2')+fc('3. Suhu (merah = E ≥ Ea)','f3','<input type="range" id="s3" min="250" max="600" value="300" aria-label="Suhu">','l3')+fc('4. Katalisator','f4','<label style="display:inline"><input type="checkbox" id="s4"> 🧩 Tambahkan katalis</label>','l4')+'</div>',ini2];
const PQ=[['Dua pereaksi (P dan Q)',tb(['No','[P] (M)','[Q] (M)','r (M/s)'],[[1,'0,2','0,1',4],[2,'0,4','0,1',16],[3,'0,2','0,3',12]]),[['Orde P',2],['Orde Q',1],['k (M⁻² s⁻¹)',1000]],'[P] ×2 → r ×4 = 2<sup>m</sup> → m = 2. [Q] ×3 → r ×3 = 3<sup>n</sup> → n = 1. k = 4 / ((0,2)²(0,1)) = 1000 M⁻² s⁻¹.'],['Tiga pereaksi (X, Y, Z)',tb(['No','[X]','[Y]','[Z]','r (M/s)'],[[1,'0,1','0,1','0,1',3],[2,'0,2','0,1','0,1',12],[3,'0,1','0,2','0,1',3],[4,'0,1','0,1','0,3',9]]),[['Orde X',2],['Orde Y',0],['Orde Z',1],['k (M⁻² s⁻¹)',3000]],'1&2: 12/3 = 4 = 2<sup>x</sup> → x = 2. 1&3: 3/3 = 1 → y = 0. 1&4: 9/3 = 3 = 3<sup>z</sup> → z = 1. k = 3 / ((0,1)²(0,1)) = 3000 M⁻² s⁻¹.'],['Penerapan persamaan laju','Reaksi 2A + B → C memiliki orde 2 terhadap A dan orde 1 terhadap B. (a) Jika [A] dijadikan 2× dan [B] 3×, laju menjadi berapa kali? (b) Pada [A] = 0,2 M, [B] = 0,1 M, r = 2 M/s. Hitung k.',[['(a) laju menjadi … kali',12],['(b) k (M⁻² s⁻¹)',500]],'(a) 2² × 3 = 12 kali. (b) k = 2 / ((0,2)²(0,1)) = 2 / 0,004 = 500 M⁻² s⁻¹.']];
MAT[3]=['Persamaan Laju & Orde Reaksi','Persamaan laju menghubungkan laju reaksi dengan konsentrasi pereaksi.',['r = k [A]<sup>m</sup> [B]<sup>n</sup>','k = r / ([A]<sup>m</sup>[B]<sup>n</sup>)'],'k = konstanta laju; m dan n = orde terhadap A dan B; m + n = orde total. Orde ditentukan dari <b>eksperimen</b>, bukan dari koefisien reaksi.',`<h3>Menentukan orde (metode laju awal)</h3><p>Pilih dua percobaan yang konsentrasi pereaksi lainnya sama, lalu bandingkan:</p><div class="f">${fr('r<sub>2</sub>','r<sub>1</sub>')} = ${'('+fr('[A]<sub>2</sub>','[A]<sub>1</sub>')+')'}<sup>m</sup></div><p>Konsentrasi ×2: laju tetap → orde 0; laju ×2 → orde 1; laju ×4 → orde 2.</p>
<h3>Contoh 1: dua pereaksi (A dan B)</h3>${tb(['No','[A] (M)','[B] (M)','r (M/s)'],[[1,'0,1','0,1','0,02'],[2,'0,2','0,1','0,08'],[3,'0,1','0,2','0,04']])}<p><b>Orde A</b> (percobaan 1 &amp; 2, [B] tetap): 0,08/0,02 = (0,2/0,1)<sup>m</sup> → 4 = 2<sup>m</sup> → m = 2.<br><b>Orde B</b> (percobaan 1 &amp; 3, [A] tetap): 0,04/0,02 = (0,2/0,1)<sup>n</sup> → 2 = 2<sup>n</sup> → n = 1.<br>Persamaan laju: <b>r = k[A]²[B]</b>, orde total 3.<br><b>Konstanta k</b> (data percobaan 1): k = 0,02 / ((0,1)²(0,1)) = 0,02/0,001 = <b>20 M⁻² s⁻¹</b>.</p>
<h3>Contoh 2: tiga pereaksi (A, B, dan C)</h3>${tb(['No','[A]','[B]','[C]','r (M/s)'],[[1,'0,1','0,1','0,1','0,01'],[2,'0,2','0,1','0,1','0,02'],[3,'0,1','0,2','0,1','0,04'],[4,'0,1','0,1','0,2','0,01']])}<p>Orde A (1 &amp; 2): 0,02/0,01 = 2 = 2<sup>m</sup> → m = 1.<br>Orde B (1 &amp; 3): 0,04/0,01 = 4 = 2<sup>n</sup> → n = 2.<br>Orde C (1 &amp; 4): 0,01/0,01 = 1 = 2<sup>p</sup> → p = 0 (C tidak memengaruhi laju).<br>Persamaan laju: <b>r = k[A][B]²</b>, orde total 3. k = 0,01 / ((0,1)(0,1)²) = <b>10 M⁻² s⁻¹</b>.</p>
<h3>Menentukan konstanta laju (k)</h3><p>Setelah persamaan laju diketahui, substitusikan data satu percobaan: k = r / ([A]<sup>m</sup>[B]<sup>n</sup>). Nilai k sama untuk semua percobaan pada suhu yang sama (bisa dipakai untuk mengecek). Satuan k = M<sup>1−orde total</sup> s⁻¹: orde 0 → M s⁻¹; orde 1 → s⁻¹; orde 2 → M⁻¹ s⁻¹; orde 3 → M⁻² s⁻¹. Nilai k berubah oleh suhu dan katalis, bukan oleh konsentrasi.</p>
<h3>📝 Latihan soal</h3>`+PQ.map((q,i)=>`<div class="card pq" data-q="${i}"><b>Soal ${i+1}. ${q[0]}</b>${q[1].startsWith('<')?q[1]:'<p>'+q[1]+'</p>'}<div class="row">${q[2].map(f=>`<div><label>${f[0]}</label><input type="number" step="any" data-a="${f[1]}"></div>`).join('')}</div><button class="btn">Periksa Jawaban</button><div class="pf"></div></div>`).join(''),()=>document.querySelectorAll('.pq').forEach(d=>{const i=+d.dataset.q;d.querySelector('button').onclick=()=>{const bad=[...d.querySelectorAll('input')].filter(e=>e.value===''||Math.abs(+e.value-+e.dataset.a)>Math.abs(+e.dataset.a)*.01+1e-9);const ok=!bad.length;if(ok)award('pq'+i,10);d.querySelector('.pf').innerHTML=(ok?'<p class="ok">✅ Benar semua!</p>':'<p class="bad">❌ Belum tepat: '+bad.map(e=>e.previousElementSibling.textContent).join(', ')+'. Bandingkan dua percobaan yang konsentrasi lainnya sama.</p>')+'<p><b>Pembahasan:</b> '+PQ[i][3]+'</p>'}})];

let qs=null;
R.quiz=()=>{if(!qs){M(`<div class="card"><h2>🎯 Kinetics Challenge</h2><p>Lulus level untuk membuka level berikutnya. +10 XP/soal benar pertama kali, +100 XP/level lulus.</p>`+Q.map((l,i)=>{const lock=i>0&&(S.best[i]||0)<Q[i-1].need;return`<div class="card"><b>${l.n}</b> — ${l.q.length} soal, lulus ≥ ${l.need}% ${S.best[i+1]!==undefined?'· Terbaik: '+S.best[i+1]+'%':''}<br>${lock?'🔒 Terkunci: capai '+Q[i-1].need+'% di level sebelumnya.':`<button class="btn" data-l="${i}">▶ Mulai</button>`}</div>`}).join('')+'</div>');
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{qs={l:+b.dataset.l,i:0,s:0,sel:null,ch:0,h:0};R.quiz()});return}
const L=Q[qs.l];if(qs.i>=L.q.length){const p=Math.round(qs.s/L.q.length*100),pass=p>=L.need;S.best[qs.l+1]=Math.max(S.best[qs.l+1]||0,p);if(pass){award('lv'+qs.l,100,qs.l==0?'q1':null);if(qs.l==4)award('leg',150,'leg')}save();
M(`<div class="card"><h2>${pass?'🎉 Lulus!':'💪 Belum lulus'}</h2><p>Skor: <b>${p}%</b> (syarat ${L.need}%)</p><button class="btn" id="a">Ulangi</button><button class="btn o" id="b">Kembali</button></div>`);$('#a').onclick=()=>{qs={l:qs.l,i:0,s:0,sel:null,ch:0,h:0};R.quiz()};$('#b').onclick=()=>{qs=null;R.quiz()};return}
const q=L.q[qs.i];M(`<div class="card"><b>${L.n}</b> · Soal ${qs.i+1}/${L.q.length}<h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="opt" data-o="${i}">${'ABCD'[i]}. ${o}</button>`).join('')}<div id="fb"></div><button class="btn" id="ck">Periksa Jawaban</button><button class="btn p" id="hi">💡 Petunjuk</button><button class="btn g" id="nx" disabled>Soal Berikutnya</button></div>`);
const os=document.querySelectorAll('.opt');os.forEach(b=>b.onclick=()=>{if(qs.ch)return;qs.sel=+b.dataset.o;os.forEach(x=>x.classList.toggle('sel',x==b))});
$('#hi').onclick=()=>$('#fb').innerHTML='<p class="note">💡 Ingat: '+['laju = perubahan per waktu.','pikirkan dua syarat tumbukan.','hubungkan dengan rumus di materi.'][qs.i%3]+'</p>';
$('#ck').onclick=()=>{if(qs.sel===null||qs.ch)return;qs.ch=1;const ok=qs.sel===q[2];os[q[2]].classList.add('right');if(!ok)os[qs.sel].classList.add('wrong');if(ok){qs.s++;award('q'+qs.l+'_'+qs.i,10)}$('#fb').innerHTML=`<p class="${ok?'ok':'bad'}">${ok?'✅ Benar!':'❌ Kurang tepat.'}</p><p>${q[3]}</p>`;$('#nx').disabled=false};
$('#nx').onclick=()=>{qs.i++;qs.sel=null;qs.ch=0;R.quiz()}};
R.prof=()=>{const l=lvl();M(`<div class="card"><h2>🏆 Pencapaian Saya</h2><div class="grid"><div class="stat s1">Level<b>${LV[l][0]}</b></div><div class="stat s2">XP<b>${S.xp}</b></div></div><h3>Badge</h3>${BG.map(b=>`<span class="bdg ${S.bdg[b[0]]?'on':''}" title="${b[2]}">${b[1]}<br><small>${S.bdg[b[0]]?'Diperoleh':b[2]}</small></span>`).join('')}
<h3>Daftar Level</h3>${LV.map((v,i)=>`<div>${i<=l?'✅':'🔒'} ${v[0]} — ${v[1]} XP</div>`).join('')}
${l>=7||S.bdg.leg?'<div class="card" style="margin-top:12px;background:linear-gradient(135deg,#ffc80044,#7c3aed33)"><h2>🎓 CONGRATULATIONS, REACTION RATE CHAMPION!</h2><p>Kamu telah menguasai dunia kinetika kimia! Teruslah bereksperimen dan berpikir kritis!</p></div>':''}
<p><button class="btn r" id="rs">♻ Reset progres</button></p></div>`);
$('#rs').onclick=()=>{if(confirm('Hapus semua progres?')){S={xp:0,done:{},best:{},bdg:{},exp:0,set:S.set};save();R.prof()}}};
applySet();go('home');
</script></body></html>
